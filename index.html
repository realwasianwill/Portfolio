// A real source viewer for the projects that are already part of the portfolio.
let sourceProject='afterglow',sourceSection='javascript',sourceWrap=true;
const sourceCache=new Map();
const sourceProjects={afterglow:{name:'Afterglow',icon:'afterglow',file:'afterglow.html',kind:'Canvas arcade',app:'afterglow'},blockwild:{name:'Blockwild',icon:'blockwild',file:'blockwild.html',kind:'WebGL sandbox',app:'blockwild'},portfolio:{name:'William ’05',icon:'computer',file:'william-desktop.html',kind:'Interactive portfolio',app:'home'}};
for(const p of publishedProjects)if(p.kind==='html')sourceProjects[p.id]={name:p.title,icon:'code',file:p.filename,kind:'Published HTML app',app:p.id};
function fullProjectSource(id){if(publishedById.has(id))return ProjectKit.text(publishedById.get(id));if(id==='portfolio')return initialPortfolioSource;if(!sourceCache.has(id)){const encoded=GAME_DATA[id];if(!encoded)return '';sourceCache.set(id,new TextDecoder().decode(Uint8Array.from(atob(encoded),c=>c.charCodeAt(0))))}return sourceCache.get(id)}
function projectSourceSection(){const full=fullProjectSource(sourceProject);if(sourceSection==='css')return full.match(/<style\b[^>]*>([\s\S]*?)<\/style>/i)?.[1].trim()||'/* No inline stylesheet. */';if(sourceSection==='javascript')return full.match(/<script(?:\s+(?![^>]*type=["']application\/json)[^>]*)?>([\s\S]*?)<\/script>/i)?.[1].trim()||'// No inline script.';return full}
function readableSource(text){return text.replace(/(data:[^;,]+;base64,)[A-Za-z0-9+/=]+/g,'$1[embedded image — full data included in the download]').replace(/\b(afterglow|blockwild):'([A-Za-z0-9+/]{500,}={0,2})'/g,"$1:'[embedded game HTML — full data included in the download]'")}
function sourceViewerHTML(){const meta=sourceProjects[sourceProject];return '<div class="source-shell"><div class="source-intro"><b>Look under the hood.</b> Browse the actual source of these AI-assisted browser projects. No repository link is required; download a complete HTML file to inspect or run it locally.</div><div class="source-layout"><aside class="source-sidebar"><h3>PROJECT FILES</h3>'+Object.entries(sourceProjects).map(([id,m])=>'<button class="source-project '+(id===sourceProject?'selected':'')+'" data-source-select="'+id+'" aria-pressed="'+(id===sourceProject)+'">'+icon(m.icon)+'<span>'+m.name+'<small>'+m.kind+'</small></span></button>').join('')+'<p>Only existing projects are listed.<br><br>HTML + CSS + JavaScript. Assets are embedded.</p></aside><div class="source-main"><div class="source-filebar"><span id="sourceFilename">'+meta.file+'</span><span id="sourceFileSize"></span></div><div class="source-controls" role="tablist" aria-label="Source section"><button class="source-tab" data-source-section="javascript" role="tab">JavaScript</button><button class="source-tab" data-source-section="css" role="tab">CSS</button><button class="source-tab" data-source-section="html" role="tab">Full HTML</button><label class="source-wrap-toggle"><input type="checkbox" id="sourceWrap" '+(sourceWrap?'checked':'')+'> Wrap lines</label></div><pre class="source-editor '+(sourceWrap?'wrapped':'')+'" id="sourceCode" tabindex="0" aria-label="Project source code"></pre><div class="source-preview-note" id="sourcePreviewNote">Read-only source. Copy and download include the complete selected code.</div><div class="source-actions"><button class="retro-btn primary" id="sourceDownload">↓ Download HTML</button><button class="retro-btn" id="sourceCopy">Copy code</button><button class="retro-btn" id="sourceLaunch">▶ Open project</button><span class="source-format">SELF-CONTAINED / NO BUILD STEP</span></div></div></div></div>'}
function renderSourceCode(){const pre=$('sourceCode');if(!pre)return;const text=projectSourceSection(),display=readableSource(text);pre.textContent=display;pre.classList.toggle('wrapped',sourceWrap);pre.scrollTop=0;pre.scrollLeft=0;$('sourceFilename').textContent=sourceProjects[sourceProject].file;const bytes=new TextEncoder().encode(fullProjectSource(sourceProject)).length;$('sourceFileSize').textContent=Math.round(bytes/1024)+' KB · '+sourceSection.toUpperCase();$('sourcePreviewNote').textContent=display!==text?'Embedded asset data is shortened only in this preview. Copy and download include the full code.':'Read-only source. Download HTML to get the complete runnable project.';document.querySelectorAll('[data-source-section]').forEach(el=>{const active=el.dataset.sourceSection===sourceSection;el.classList.toggle('selected',active);el.setAttribute('aria-selected',String(active))});document.querySelectorAll('[data-source-select]').forEach(el=>{const active=el.dataset.sourceSelect===sourceProject;el.classList.toggle('selected',active);el.setAttribute('aria-pressed',String(active))})}
function openProjectSource(id){if(!sourceProjects[id])return;sourceProject=id;openApp('source');renderSourceCode()}
function downloadProjectSource(){const meta=sourceProjects[sourceProject];const blob=new Blob([fullProjectSource(sourceProject)],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=meta.file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('Download requested.',meta.file+' · If this preview blocks downloads, use the live website in a new tab.')}
async function copyProjectSource(){const text=projectSourceSection();let copied=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);copied=true}}catch(e){}if(!copied){const field=document.createElement('textarea');field.value=text;Object.assign(field.style,{position:'fixed',left:'-10000px',top:'0'});document.body.appendChild(field);field.select();try{copied=document.execCommand('copy')}catch(e){}field.remove()}if(copied)notify('Source copied.',sourceProjects[sourceProject].file+' · Complete '+sourceSection+' section, including embedded assets.');else{const pre=$('sourceCode'),range=document.createRange();range.selectNodeContents(pre);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);notify('Preview code selected.','Press Ctrl+C / Cmd+C to copy, or download the complete HTML file.')}}
document.addEventListener('click',e=>{const choose=e.target.closest('[data-source-select]');if(choose){sourceProject=choose.dataset.sourceSelect;renderSourceCode();return}const section=e.target.closest('[data-source-section]');if(section){sourceSection=section.dataset.sourceSection;renderSourceCode();return}const shortcut=e.target.closest('[data-source-project]');if(shortcut){openProjectSource(shortcut.dataset.sourceProject);return}if(e.target.closest('#sourceDownload'))downloadProjectSource();else if(e.target.closest('#sourceCopy'))copyProjectSource();else if(e.target.closest('#sourceLaunch'))openApp(sourceProjects[sourceProject].app)});
document.addEventListener('change',e=>{if(e.target.id==='sourceWrap'){sourceWrap=e.target.checked;$('sourceCode')?.classList.toggle('wrapped',sourceWrap)}});

$('startBtn').innerHTML=icon('computer')+'Start';$('showDesktop').innerHTML=icon('computer');$('startItems').innerHTML=[['home','My Desktop','computer'],['about','About William','about'],['projects','My Projects','folder'],['source','Project source code','code'],['music','WilliamAmp player','music'],['pet','Desktop Buddy','pet'],['quest','Explorer Quest','quest'],['linkedin','Connect on LinkedIn ↗','linkedin']].map(([id,t,ic])=>'<button class="start-item" data-app="'+id+'">'+icon(ic)+t+'</button>').join('')+'<hr><button class="start-item" data-app="help">'+icon('help')+'Help</button><button class="start-item" id="shutdownBtn">'+icon('shutdown')+'Shut Down…</button>';
$('startBtn').onclick=e=>{e.stopPropagation();let open=$('startMenu').classList.toggle('open');$('startBtn').setAttribute('aria-expanded',String(open));beep()};document.addEventListener('click',e=>{if(e.target.closest('#copyLinkedin')){const input=$('linkedinURL');input.focus();input.select();try{if(document.execCommand('copy'))notify('Profile link copied.','Paste it into your browser or send it to a friend.');else notify('Profile address selected.','Press Ctrl+C, or long-press to copy on mobile.')}catch(err){notify('Profile address selected.','Press Ctrl+C, or long-press to copy on mobile.')}}const b=e.target.closest('[data-app]');if(b)openApp(b.dataset.app);const m=e.target.closest('[data-max]');if(m)maximize(m.dataset.max);if(!e.target.closest('#startMenu')&&!e.target.closest('#startBtn')){$('startMenu').classList.remove('open');$('startBtn').setAttribute('aria-expanded','false')}});
$('showDesktop').onclick=()=>{if([...windows.values()].some(w=>!w.el.classList.contains('hidden')))revealDesktop();else{for(let [id]of windows)focus(id);desktopHidden=false}};
$('soundBtn').onclick=()=>{sound=!sound;saveDesktopSound();syncDesktopSoundUI();if(!sound)stopPetSounds();notify(sound?'Sound on. Nostalgia engaged.':'Quiet mode.','Desktop effects '+(sound?'enabled.':'muted.'));if(sound)armDesktopAudio().then(()=>beep('quest'))};
$('shutdownBtn').onclick=()=>{pauseMusic();$('startMenu').classList.remove('open');$('shutdown').classList.add('show');beep('close')};$('restart').onclick=()=>{$('shutdown').classList.remove('show');openApp('home')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('startMenu').classList.remove('open');$('startBtn').setAttribute('aria-expanded','false')}});
function clock(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);
window.addEventListener('resize',()=>{for(let w of windows.values()){if(innerWidth<760)w.el.classList.add('maximized');else if(!w.el.classList.contains('maximized')){w.el.style.left=Math.max(0,Math.min(w.el.offsetLeft,$('desktop').clientWidth-120))+'px';w.el.style.top=Math.max(0,Math.min(w.el.offsetTop,$('desktop').clientHeight-80))+'px'}}});
openApp('home');if(innerWidth>=1100){openApp('quest');focus('home')}if(musicRestoreOpen)openApp('music');setTimeout(()=>notify('Welcome to William ’05.','Meet your desktop buddy! Add files to My Projects to help him grow.'),1200);
})();
